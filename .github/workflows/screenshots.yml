name: Screenshots

# Keeps the README screenshots in docs/screenshots/ up to date: plays the built game in headless
# Chromium and commits new PNGs to the same branch when the UI changed.
on:
  # Manual only (Actions → Screenshots → Run workflow, pick a branch): screens change too often during early
  # development to regenerate them on every push.
  workflow_dispatch:
    inputs:
      shots:
        description: "all, or buildings: only the building close-ups in docs/screenshots/look/ (a quick check)"
        type: choice
        options: [all, buildings]
        default: all

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Take screenshots
        env:
          SHOTS: ${{ inputs.shots }}
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/screenshots.mjs
      - name: Commit changed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          # No "[skip ci]" here: pushes made with the workflow's own token never start workflows anyway, and the marker
          # would end up in the squash-merge message on main and skip the Pages deploy.
          git commit -m "Update README screenshots"
          git push

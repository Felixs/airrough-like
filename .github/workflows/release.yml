name: Release

# Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) publishes multi-arch Docker images
# (linux/amd64 for Intel/AMD PCs and servers, linux/arm64 for Raspberry Pi and ARM machines) to the
# GitHub Container Registry (and the GitLab registry when GITLAB_IMAGE is set) and creates a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image names and version
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          minor="${version%.*}"
          tags="$image:$version,$image:$minor,$image:latest"
          if [ -n "${{ vars.GITLAB_IMAGE }}" ]; then
            tags="$tags,${{ vars.GITLAB_IMAGE }}:$version,${{ vars.GITLAB_IMAGE }}:$minor"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.GITLAB_IMAGE != ''
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_ID=v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=Airport Auto Battler
          tags: ${{ steps.meta.outputs.tags }}
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="${{ steps.meta.outputs.image }}"
          version="${{ steps.meta.outputs.version }}"
          pages="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          cat > notes.md <<NOTES
          ## Play
          - In the browser: $pages

          ## Docker image (linux/amd64 + linux/arm64)
          \`\`\`bash
          docker run -d -p 8080:80 --name airport-auto-battler $image:$version
          \`\`\`
          Then open http://localhost:8080. Tags: \`$version\`, \`${version%.*}\`, \`latest\`.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" --title "Airport Auto Battler $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag

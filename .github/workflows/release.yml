name: Release

# Builds the Windows executable and publishes it as a GitHub release.
# - Push to main: releases v<config/version from project.godot> if that tag doesn't exist yet,
#   so bumping the version on main is enough to ship a new release.
# - Push a version tag (e.g. `git tag v0.2 && git push origin v0.2`): releases that tag.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="v$(grep -oP '^config/version="\K[^"]+' project.godot)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists, building without publishing."
              publish=false
            else
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $tag, publish=$publish"

      - name: Install Godot and the Windows export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -j -q templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$dir"
          rm godot.zip templates.tpz

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Self-test
        run: |
          out=$(godot --headless --path . -- --selftest rate=4 seconds=300 2>&1)
          echo "$out"
          echo "$out" | grep -q "RULES ok"
          echo "$out" | grep -q "^SELFTEST"
          ! echo "$out" | grep -q "SCRIPT ERROR"

      - name: Export Windows build
        run: |
          mkdir -p export/windows
          godot --headless --path . --export-release "Windows Desktop" export/windows/AirportAutoBattler.exe
          test -s export/windows/AirportAutoBattler.exe
          cd export/windows && zip -9 "../../AirportAutoBattler-${{ steps.version.outputs.tag }}-windows.zip" AirportAutoBattler.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirportAutoBattler-windows
          path: AirportAutoBattler-*-windows.zip

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Airport Auto-Battler ${{ steps.version.outputs.tag }}
          files: AirportAutoBattler-*-windows.zip
          generate_release_notes: true

name: Release

# Push a version tag (e.g. `git tag v0.1 && git push origin v0.1`) to build the
# Windows executable and publish it as a GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the Windows export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -j -q templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$dir"
          rm godot.zip templates.tpz

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Self-test
        run: |
          out=$(godot --headless --path . -- --selftest rate=4 seconds=300 2>&1)
          echo "$out"
          echo "$out" | grep -q "RULES ok"
          echo "$out" | grep -q "^SELFTEST"
          ! echo "$out" | grep -q "SCRIPT ERROR"

      - name: Export Windows build
        run: |
          mkdir -p export/windows
          godot --headless --path . --export-release "Windows Desktop" export/windows/AirportAutoBattler.exe
          test -s export/windows/AirportAutoBattler.exe
          cd export/windows && zip -9 "../../AirportAutoBattler-${GITHUB_REF_NAME}-windows.zip" AirportAutoBattler.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirportAutoBattler-windows
          path: AirportAutoBattler-*-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AirportAutoBattler-*-windows.zip
          generate_release_notes: true

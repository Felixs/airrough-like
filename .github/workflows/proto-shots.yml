name: Prototype shots

# Throwaway (branch proto/buildings, never merged): renders proto/buildings.html in headless Chromium and commits
# the pictures to proto/shots/.
on:
  push:
    branches: ['proto/**']
    paths: ['proto/*.html', 'proto/*.mjs', '.github/workflows/proto-shots.yml']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Render
        run: |
          python3 -m http.server 8000 &
          sleep 2
          node proto/shots.mjs
      - name: Commit pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proto/shots
          git commit -m "Prototype shots" || exit 0
          git push

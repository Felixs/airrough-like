# Runs the game on a Raspberry Pi (or any Docker host) on your home network.
# Uses the public release image by default; set IMAGE in a .env file to use another one, e.g.
#   IMAGE=registry.gitlab.com/<your-namespace>/<your-project>:latest   (the private image built from every main push)
services:
  game:
    image: ${IMAGE:-ghcr.io/felixs/airrough-like:latest}
    container_name: airport-auto-battler
    ports:
      - "8080:80"
    restart: unless-stopped
